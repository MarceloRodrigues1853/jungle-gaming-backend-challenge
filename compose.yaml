x-api-environment: &api-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-jungle_app}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-jungle_gaming}?sslmode=disable
      OIDC_INTROSPECTION_URL: http://keycloak:8080/realms/jungle-dev/protocol/openid-connect/token/introspect
      OIDC_INTROSPECTION_CLIENT_ID: jungle-api
      OIDC_INTROSPECTION_CLIENT_SECRET: jungle-api-introspection-secret
      PROVIDER_CLIENT_ID: provider-a
      PROVIDER_ID: provider-a
      INTERNAL_CLIENT_ID: wallet-internal
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://localstack:4566
      SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_OUTPUT_QUEUE_URL: http://localstack:4566/000000000000/jungle-events.fifo
      SQS_MAX_RECEIVE_COUNT: 5

x-api-service: &api-service
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_started

services:
  api:
    <<: *api-service
    environment:
      <<: *api-environment
      HTTP_ADDRESS: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8090:8090"

  api-1:
    <<: *api-service
    profiles: ["distributed"]
    environment:
      <<: *api-environment
      HTTP_ADDRESS: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8091:8090"

  api-2:
    <<: *api-service
    profiles: ["distributed"]
    environment:
      <<: *api-environment
      HTTP_ADDRESS: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8092:8090"

  api-3:
    <<: *api-service
    profiles: ["distributed"]
    environment:
      <<: *api-environment
      HTTP_ADDRESS: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8093:8090"

  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle_gaming}
      POSTGRES_USER: ${POSTGRES_USER:-jungle_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  keycloak:
    image: keycloak/keycloak:26.7.4-0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local_admin_only}
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name jungle-events.fifo >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  localstack_data:
