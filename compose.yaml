services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle_gaming}
      POSTGRES_USER: ${POSTGRES_USER:-jungle_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  keycloak:
    image: keycloak/keycloak:26.7.4-0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local_admin_only}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name jungle-events.fifo >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  localstack_data:
